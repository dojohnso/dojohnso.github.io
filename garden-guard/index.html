<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a7d3a">
<!-- iOS standalone (home-screen) web app: fill the screen, no Safari chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garden Defense">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Garden Defense</title>
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --grass:#6ab04c; --dirt:#8a5a2b; --ink:#13301a; --leaf:#3a7d3a; --sky:#bfe3ff; }
  html, body { height: 100%; }
  body {
    font-family: 'Courier New', monospace;
    background: #13301a; color: #fff;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
  }
  #stage {
    /* 100vw/100vh include the notch/home-indicator strip under viewport-fit=cover,
       so the stage spans the FULL physical screen and the canvas centers on it. */
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex; justify-content: center; align-items: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #6ab04c;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: 12px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="mapSelect" class="overlay"><h1>Garden Defense</h1></div>
  <div id="gameOver" class="overlay hidden"></div>
</div>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const IW = 640, IH = 360; // internal resolution (landscape 16:9)
  const VERSION = 'v35';    // bump alongside CACHE_NAME in sw.js on each release

  const START_CASH = 200;
  const START_HEARTS = 20;
  const UNLOCK_WAVE = 10;          // clear this wave to unlock the next map
  const WIN_WAVE = 20;             // clear this wave to "defend the map" (win screen)
  const WAVE_CLEAR_BONUS = 26;     // cash awarded when a wave is fully cleared
  const WAVE_COUNTDOWN_MS = 8000;  // auto-start the next wave after this idle countdown
  const EARLY_START_BONUS_PER_SEC = 2; // bonus cash per whole second skipped by tapping Start Wave early

  // Tower types. range/px, dmg, fireMs (cooldown), and per-tier stats.
  // tiers[i] gives {cost, dmg, range, fireMs} for tier i (0 = base buy).
  const TOWERS = {
    can:    { name: 'Watering Can',   short:'Can',     color: '#4aa3ff', proj: 'drop', img:'tower-can',
              tiers: [ {cost:60,  dmg:6,  range:90,  fireMs:600},
                       {cost:50,  dmg:11, range:102, fireMs:540},
                       {cost:90,  dmg:20, range:116, fireMs:480} ] },
    zapper: { name: 'Bug Zapper',     short:'Zapper',  color: '#ffe14a', proj: 'zap', img:'tower-zapper', aoe:34, slow:0.5, slowMs:900, antiAir:true,
              tiers: [ {cost:90,  dmg:4,  range:88,  fireMs:1100},
                       {cost:80,  dmg:7,  range:98,  fireMs:1000},
                       {cost:130, dmg:12, range:108, fireMs:900} ] },
    sprink: { name: 'Sprinkler',      short:'Sprink',  color: '#4ad6c0', proj: 'splash', img:'tower-sprink', aoe:22,
              tiers: [ {cost:75,  dmg:3,  range:85,  fireMs:280},
                       {cost:70,  dmg:5,  range:94,  fireMs:250},
                       {cost:110, dmg:8,  range:104, fireMs:220} ] },
    scare:  { name: 'Scarecrow Sling', short:'Scare',  color: '#c98a3a', proj: 'pebble', img:'tower-scare', antiAir:true,
              tiers: [ {cost:120, dmg:22, range:140, fireMs:1400},
                       {cost:110, dmg:38, range:155, fireMs:1300},
                       {cost:170, dmg:64, range:170, fireMs:1200} ] },
    // Beehive: fires a SWARM of homing bees that chase their target until they connect
    // (guaranteed hit). bees = how many per volley; modest per-bee dmg. Great vs fast pests.
    beehive:{ name: 'Beehive',        short:'Beehive', color: '#f2b705', proj: 'bee', img:'tower-beehive', bees: 2, antiAir:true,
              tiers: [ {cost:100, dmg:5,  range:95,  fireMs:900,  bees:2},
                       {cost:90,  dmg:8,  range:105, fireMs:820,  bees:3},
                       {cost:140, dmg:13, range:118, fireMs:740,  bees:3} ] },
    // Mole Trap: no range ring — a buried trap. When a GROUND pest crosses its spot it
    // pops up for big fixed damage (chunks bosses, one-shots normal pests), then burrows
    // for a cooldown before re-arming. Can't hit flyers. 'trig' = trigger radius (px).
    mole:   { name: 'Mole Trap',      short:'Mole',    color: '#7a5230', trap:true, trig:16,
              tiers: [ {cost:80,  dmg:120, range:16, fireMs:7000},
                       {cost:70,  dmg:260, range:16, fireMs:6000},
                       {cost:120, dmg:520, range:16, fireMs:5000} ] },
    // Thorn Flinger: flings a single poison-tipped thorn at one target (GROUND or AIR —
    // antiAir). Low direct dmg, but the thorn POISONS: duration-based DoT that ticks small
    // damage and bypasses armor. Re-hitting refreshes/extends. Great vs tanky/slow (snails,
    // caterpillars, boss) + a 2nd anti-air option. poisTick=dmg/tick, poisMs=duration.
    sprayer:{ name: 'Thorn Flinger', short:'Thorn',   color: '#7fae3c', proj: 'poison', antiAir:true,
              tiers: [ {cost:85,  dmg:2, range:92,  fireMs:700, poisTick:4,  poisMs:2600},
                       {cost:75,  dmg:3, range:102, fireMs:640, poisTick:7,  poisMs:3000},
                       {cost:120, dmg:5, range:112, fireMs:580, poisTick:11, poisMs:3400} ] },
  };
  // Ordered by unlock wave so the bar reads left→right as a progression.
  const TOWER_ORDER = ['can','sprink','zapper','beehive','mole','sprayer','scare'];
  const SELL_REFUND = 0.6; // fraction of total spent returned on sell

  // Account-wide tower unlocks: a tower is available once the player's best wave reached
  // (across all maps) hits its threshold. 0 = unlocked from the start. Permanent once earned.
  // Thresholds roughly track when each tower's counter-threat first appears.
  const TOWER_UNLOCK = {
    can: 0, sprink: 0,   // starting kit
    zapper: 3,           // early AoE/slow
    beehive: 5,          // anti-air, before moths @ wave 6
    mole: 7,             // chokepoint trap
    sprayer: 9,          // poison DoT, before the wave-10 boss
    scare: 12,           // heavy sniper reward
  };
  function towerUnlocked(id) { return (meta.topWave || 0) >= (TOWER_UNLOCK[id] || 0); }

  // Capability tags shown as little icons on each tower slot (air / aoe / poison / slow).
  // Derived from the tower's def flags/stats; order is stable for consistent layout.
  function towerTags(id) {
    const def = TOWERS[id], t0 = def.tiers ? def.tiers[0] : {};
    const tags = [];
    if (def.antiAir) tags.push('air');
    if (def.aoe) tags.push('aoe');
    if (def.proj === 'poison' || t0.poisTick) tags.push('poison');
    if (def.slow) tags.push('slow');
    return tags;
  }

  // Pest types. hp/speed scale with wave elsewhere. hearts = cost if it leaks.
  const PESTS = {
    ant:   { name:'Ant',         hp:16,  speed:40, bounty:5,  hearts:1, color:'#8a3b2b', size:10, img:'pest-ant',    sprH:12 },
    beetle:{ name:'Beetle',      hp:52,  speed:24, bounty:12, hearts:2, color:'#2b3a8a', size:14, img:'pest-beetle', sprH:16 },
    lizard:{ name:'Lizard',      hp:11,  speed:82, bounty:6,  hearts:1, color:'#3a9d4a', size:12, img:'pest-lizard', sprH:14 },
    cat:   { name:'Caterpillar', hp:280, speed:20, bounty:60, hearts:5, color:'#b85ac0', size:20, img:'pest-cat',    sprH:24 },
    // Splitter: on death it spawns 2 'aphidling' children (less HP, faster) just behind
    // its death spot. Children don't re-split. Kill it early or get swarmed.
    aphid: { name:'Aphid',       hp:40,  speed:34, bounty:14, hearts:2, color:'#9fd14a', size:15, sprH:16, splits:2, childType:'aphidling' },
    aphidling:{ name:'Aphidling',hp:9,   speed:66, bounty:3,  hearts:1, color:'#c6e87a', size:9,  sprH:10 },
    // Flyer: only anti-air towers (Beehive/Zapper/Scarecrow) can hit it; ground traps/
    // towers whiff. Hovers above the path with a drop-shadow. Moderate HP, quick.
    moth:  { name:'Moth',        hp:28,  speed:58, bounty:12, hearts:2, color:'#d9c7a0', size:14, sprH:16, flying:true },
    // Armored: subtracts `armor` from every DIRECT hit (min 1 gets through), so rapid weak
    // shots are gutted and heavy hits punch through. Poison DoT bypasses armor (see
    // damagePest) — the Sprayer is its natural counter. Slow, chunky, good bounty.
    snail: { name:'Snail',       hp:46,  speed:22, bounty:16, hearts:2, color:'#c58a5a', size:16, sprH:18, armor:4 },
    // BOSS: huge HP, slow, big bounty + hearts if it leaks. Appears as the finale of the
    // wave-10 and wave-20 boss waves. Canvas-drawn (no sprite); boss flag drives the big
    // HP bar + screen shake on hits. Ground type (mole traps & all towers can hit it).
    grub:  { name:'Grubzilla',   hp:1400, speed:16, bounty:200, hearts:10, color:'#7b4ea0', size:34, sprH:40, boss:true },
  };

  // Maps as data. path = ordered waypoints (internal px). plots = buildable centers.
  // diff = per-map HP/wave-size multiplier. Path length drives coverage difficulty
  // under free placement (longer, windier = more shoot time = easier).
  const MAPS = [
    // EASY: long, winding S — lots of grass beside it, generous shoot time.
    { id:'backyard', name:'Backyard Veggie Patch', difficulty:'Easy', diff: 1.0,
      path: [ {x:-20,y:80}, {x:150,y:80}, {x:150,y:210}, {x:60,y:210}, {x:60,y:290},
              {x:290,y:290}, {x:290,y:140}, {x:420,y:140}, {x:420,y:280}, {x:550,y:280},
              {x:550,y:110}, {x:660,y:110} ] },
    // MEDIUM: moderate length, a few bends.
    { id:'flowerbed', name:'Flower Bed Maze', difficulty:'Medium', diff: 1.2,
      path: [ {x:-20,y:70}, {x:430,y:70}, {x:430,y:230}, {x:150,y:230}, {x:150,y:290},
              {x:560,y:290}, {x:560,y:160}, {x:660,y:160} ] },
    // HARD: short, direct Z — minimal exposure, little room to line up towers.
    { id:'greenhouse', name:'Greenhouse', difficulty:'Hard', diff: 1.4,
      path: [ {x:-20,y:120}, {x:330,y:120}, {x:330,y:280}, {x:500,y:280},
              {x:500,y:90}, {x:660,y:90} ] },
  ];

  // ---- Sprite images ----
  const IMG = {};
  function loadImages(done) {
    const names = ['tower-can','tower-zapper','tower-sprink','tower-scare',
                   'pest-ant','pest-beetle','pest-lizard','pest-cat','veggie'];
    let left = names.length;
    names.forEach(n => {
      const im = new Image();
      im.onload = im.onerror = () => { if (--left === 0) done(); };
      im.src = './public/' + n + '.png';
      IMG[n] = im;
    });
  }

  // ---- Persistent meta (unlocks + best wave) ----
  const META_KEY = 'gardenGuardMeta_v1';

  function freshMeta() {
    // best[mapId] = highest wave cleared; topWave = best wave reached across ALL maps
    // (drives account-wide tower unlocks).
    return { unlocked: { backyard: true }, best: {}, topWave: 0 };
  }
  function loadMeta() {
    try {
      const raw = localStorage.getItem(META_KEY);
      if (!raw) return freshMeta();
      const m = JSON.parse(raw);
      // Back-fill topWave for existing saves from the best per-map waves they already have.
      const best = m.best || {};
      const topWave = m.topWave != null ? m.topWave : Math.max(0, ...Object.values(best));
      return { unlocked: m.unlocked || { backyard:true }, best, topWave };
    } catch (e) { return freshMeta(); }
  }
  function saveMeta() {
    try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
  }

  let meta = loadMeta();

  // Scale the canvas element to the largest fit in the viewport,
  // preserving the 16:9 internal ratio. Drawing always happens in IW×IH space.
  const stage = document.getElementById('stage');
  function fitCanvas() {
    // Use the visual viewport (true visible area) as the source of truth — on iOS
    // 100vh/stage.clientHeight over-reports (includes area behind the browser UI),
    // which made the canvas taller than the screen and clipped/off-centered it.
    const vv = window.visualViewport;
    const vw = (vv && vv.width)  || window.innerWidth  || document.documentElement.clientWidth;
    const vh = (vv && vv.height) || window.innerHeight || document.documentElement.clientHeight;
    // Keep the #stage sized to the real visible viewport so fl* centering is correct.
    stage.style.width = vw + 'px';
    stage.style.height = vh + 'px';
    const scale = Math.min(vw / IW, vh / IH);
    canvas.style.width = Math.floor(IW * scale) + 'px';
    canvas.style.height = Math.floor(IH * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  // Re-fit on rotate (with delayed passes — iOS reports the old size synchronously).
  window.addEventListener('orientationchange', () => { fitCanvas(); setTimeout(fitCanvas, 250); setTimeout(fitCanvas, 600); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
  // Standalone launch settles the viewport late — re-fit on load and a few beats after.
  window.addEventListener('load', () => { fitCanvas(); setTimeout(fitCanvas, 150); setTimeout(fitCanvas, 500); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fitCanvas(); });
  fitCanvas();

  // ---- Path geometry helpers ----

  // Precompute cumulative segment lengths for a path so we can map dist→point.
  function buildPath(points) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i+1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      segs.push({ a, b, len, start: total });
      total += len;
    }
    return { points, segs, total };
  }
  // Map a distance traveled to an {x,y} on the path. Clamps to the ends.
  function pointAt(path, dist) {
    if (dist <= 0) return { ...path.points[0] };
    if (dist >= path.total) return { ...path.points[path.points.length - 1] };
    for (const s of path.segs) {
      if (dist <= s.start + s.len) {
        const t = (dist - s.start) / s.len;
        return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t };
      }
    }
    return { ...path.points[path.points.length - 1] };
  }
  function dist2(ax, ay, bx, by) { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

  // ---- Free-placement geometry ----
  const PATH_HALF_W = 13;        // path stroke is 26px wide → 13px half-width
  const TOWER_R = 12;            // tower footprint radius (for spacing + path clearance)
  const PATH_CLEAR = PATH_HALF_W + TOWER_R - 2;  // min center-to-path distance to place
  const TOWER_GAP = TOWER_R * 2 - 2;             // min center-to-center between towers

  // Shortest distance from point (px,py) to a line segment a→b.
  function distToSeg(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx*dx + dy*dy;
    let t = len2 ? ((px - a.x) * dx + (py - a.y) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (a.x + t*dx), py - (a.y + t*dy));
  }
  // Shortest distance from a point to the whole path polyline.
  function distToPath(px, py) {
    let best = Infinity;
    for (const s of game.path.segs) best = Math.min(best, distToSeg(px, py, s.a, s.b));
    return best;
  }
  // Can a tower of `type` be placed centered at (x,y)? Checks bounds, path rules,
  // decor, tower spacing. Regular towers must sit OFF the path; traps must sit ON it
  // (within trigger reach of the path) so pests actually cross them.
  function canPlace(x, y, type, ignoreTower) {
    if (x < TOWER_R || x > IW - TOWER_R) return false;      // playfield bounds (x)
    if (y < 24 + TOWER_R || y > IH - 40 - TOWER_R) return false; // clear HUD top strip + tower bar
    const def = type ? TOWERS[type] : null;
    const dp = distToPath(x, y);
    if (def && def.trap) {
      // Trap: must be ON/beside the path so its trigger circle covers path pests.
      if (dp > PATH_HALF_W + (def.trig || 16) - 4) return false; // too far from the path
    } else {
      if (dp < PATH_CLEAR) return false;                    // regular tower: off the path
    }
    for (const d of game.decor) {                           // not on a tree/bush
      const clear = d.r + TOWER_R - 2;
      if (dist2(x, y, d.x, d.y) < clear*clear) return false;
    }
    for (const t of game.towers) {                          // not overlapping another tower
      if (t === ignoreTower) continue;
      if (dist2(x, y, t.x, t.y) < TOWER_GAP*TOWER_GAP) return false;
    }
    return true;
  }

  // ---- Terrain / path renderer ----

  // Texture is baked ONCE into offscreen canvases, then blitted each frame — never
  // speckle per-frame (thousands of draws/tick would tank the framerate).

  // A repeating grass tile: base green + a fine, even scatter of tiny blade marks.
  // Kept deliberately subtle (no big tonal blobs — those read as clumps on repeat).
  const GRASS_TILE = (() => {
    const T = 96, c = document.createElement('canvas'); c.width = c.height = T;
    const g = c.getContext('2d');
    g.fillStyle = '#6ab04c'; g.fillRect(0, 0, T, T);
    // very faint, small tone flecks for a touch of variation — low alpha, small radius
    for (let i = 0; i < 40; i++) {
      const lit = Math.random() < 0.5;
      g.fillStyle = lit ? 'rgba(120,186,88,0.18)' : 'rgba(78,132,56,0.16)';
      const x = Math.random()*T, y = Math.random()*T, r = 1.5 + Math.random()*2.5;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    }
    // the main texture: lots of tiny blades, light + dark, evenly spread and low-contrast
    for (let i = 0; i < 150; i++) {
      const x = Math.random()*T, y = Math.random()*T;
      const lit = Math.random() < 0.55;
      g.strokeStyle = lit ? 'rgba(130,200,96,0.35)' : 'rgba(58,110,44,0.35)';
      g.lineWidth = 1;
      const lean = (Math.random()-0.5)*2;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + lean, y - (2 + Math.random()*2)); g.stroke();
    }
    return g.createPattern(c, 'repeat');
  })();

  // Bake the dirt path (with pebble/mottle texture) for a given path into a full-field
  // offscreen canvas. Path is fixed per game, so this runs once in newGame().
  function bakePathTexture(path) {
    const c = document.createElement('canvas'); c.width = IW; c.height = IH;
    const g = c.getContext('2d');
    // the dirt stroke itself
    g.strokeStyle = '#9a6a3a';
    g.lineWidth = 26; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath();
    path.points.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y));
    g.stroke();
    // a slightly darker edge: stroke again, thinner, with a subtle inner line for depth
    g.strokeStyle = 'rgba(120,82,44,0.55)'; g.lineWidth = 20;
    g.beginPath();
    path.points.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y));
    g.stroke();
    // pebbles: small dots placed within the path half-width (so they land on dirt,
    // not the grass), varied tone — this is the path's texture.
    for (const s of path.segs) {
      const steps = Math.max(2, Math.floor(s.len / 7));
      for (let i = 0; i < steps; i++) {
        const t = i / steps;
        const cx = s.a.x + (s.b.x - s.a.x) * t;
        const cy = s.a.y + (s.b.y - s.a.y) * t;
        // perpendicular offset within the path half-width
        const nx = -(s.b.y - s.a.y), ny = (s.b.x - s.a.x);
        const nl = Math.hypot(nx, ny) || 1;
        const off = (Math.random() - 0.5) * 2 * (PATH_HALF_W - 3);
        const px = cx + nx/nl * off, py = cy + ny/nl * off;
        const dark = Math.random() < 0.5;
        g.fillStyle = dark ? 'rgba(110,74,38,0.6)' : 'rgba(176,132,82,0.6)';
        const r = 0.8 + Math.random()*1.6;
        g.beginPath(); g.arc(px, py, r, 0, Math.PI*2); g.fill();
      }
    }
    return c;
  }

  function drawTerrain(path) {
    // grass: one patterned fill (texture baked into GRASS_TILE)
    ctx.fillStyle = GRASS_TILE;
    ctx.fillRect(0, 0, IW, IH);
    // dirt path: blit the pre-baked, textured path canvas
    if (game && game.pathTex) ctx.drawImage(game.pathTex, 0, 0);
    else {
      ctx.strokeStyle = '#9a6a3a';
      ctx.lineWidth = 26; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      path.points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.stroke();
    }
    // veggie patch (goal) at path end
    const goal = path.points[path.points.length - 1];
    const veg = IMG['veggie'];
    if (veg && veg.width) {
      ctx.drawImage(veg, Math.round(goal.x - veg.width/2), Math.round(goal.y - veg.height + 12));
    } else {
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(goal.x - 24, goal.y - 24, 36, 48);
    }
  }

  // ---- Scenery renderer (canvas-drawn trees + bushes) ----
  function drawDecor(decor) {
    for (const d of decor) {
      // soft ground shadow for a touch of depth
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      ctx.beginPath();
      ctx.ellipse(d.x, d.y + d.r * 0.5, d.r * 1.1, d.r * 0.45, 0, 0, Math.PI*2);
      ctx.fill();
      if (d.kind === 'tree') {
        // trunk
        ctx.fillStyle = '#7a4a22';
        ctx.fillRect(Math.round(d.x - 3), Math.round(d.y), 6, Math.round(d.r * 0.8));
        // layered canopy (dark base → mid → highlight)
        const cy = d.y - d.r * 0.3;
        ctx.fillStyle = '#2f5d2a';
        ctx.beginPath(); ctx.arc(d.x, cy, d.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3f7d36';
        ctx.beginPath(); ctx.arc(d.x - d.r*0.25, cy - d.r*0.2, d.r*0.75, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#56a046';
        ctx.beginPath(); ctx.arc(d.x - d.r*0.35, cy - d.r*0.35, d.r*0.4, 0, Math.PI*2); ctx.fill();
      } else {
        // bush: three overlapping blobs, lit from upper-left
        const b = d.r;
        ctx.fillStyle = '#35702e';
        ctx.beginPath(); ctx.arc(d.x - b*0.5, d.y, b*0.7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(d.x + b*0.5, d.y, b*0.7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(d.x, d.y - b*0.25, b*0.85, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#4e9440';
        ctx.beginPath(); ctx.arc(d.x - b*0.2, d.y - b*0.35, b*0.4, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  // ---- Runtime state ----

  let game = null;
  let screen = 'mapSelect'; // 'mapSelect' | 'playing' | 'gameover'

  // ---- Scenery (trees + bushes) ----
  // Obstacle radii: the footprint a tower center must stay clear of.
  const TREE_R = 15, BUSH_R = 10;

  // Scatter random trees/bushes across the grass. Fresh per game (plain Math.random),
  // but frozen into game.decor so it's stable wave-to-wave. Rejects anything on the
  // path, on the veggie goal, under the HUD strips, or overlapping other scenery.
  function scatterDecor(path) {
    const decor = [];
    const goal = path.points[path.points.length - 1];
    const target = 8 + Math.floor(Math.random() * 7);   // aim for 8..14 pieces
    let tries = 0;
    while (decor.length < target && tries < 400) {
      tries++;
      const kind = Math.random() < 0.45 ? 'tree' : 'bush';
      const r = kind === 'tree' ? TREE_R : BUSH_R;
      const x = r + Math.random() * (IW - 2*r);
      const y = (24 + r) + Math.random() * ((IH - 40 - r) - (24 + r));
      if (distToPathPts(x, y, path) < PATH_HALF_W + r + 6) continue;  // keep off the path
      if (dist2(x, y, goal.x, goal.y) < 42*42) continue;              // clear the veggie goal
      let clash = false;
      for (const d of decor) {
        if (dist2(x, y, d.x, d.y) < (r + d.r + 4) * (r + d.r + 4)) { clash = true; break; }
      }
      if (clash) continue;
      decor.push({ x, y, kind, r });
    }
    return decor;
  }
  // Path-distance helper that takes an explicit path (used before game.path is set).
  function distToPathPts(px, py, path) {
    let best = Infinity;
    for (const s of path.segs) best = Math.min(best, distToSeg(px, py, s.a, s.b));
    return best;
  }

  function newGame(mapId) {
    const def = MAPS.find(m => m.id === mapId);
    const path = buildPath(def.path);
    game = {
      mapId, def,
      path,
      pathTex: bakePathTexture(path), // pre-rendered textured dirt path (baked once)
      decor: scatterDecor(path),  // frozen-per-game trees + bushes (placement obstacles)
      towers: [],       // free-placed {type, tier, x, y, cooldown}
      cash: START_CASH,
      hearts: START_HEARTS,
      wave: 0,
      waveActive: false,
      pests: [],        // {type, hp, maxHp, dist, speed, slowUntil}
      projectiles: [],  // {x,y, tx,ty, target, dmg, kind, aoe, slow, slowMs, speed}
      spawnQueue: [],   // pending {type, atMs} for the active wave
      elapsed: 0,       // ms since wave start, for spawn scheduling
      countdown: null,  // ms until the next wave auto-starts (null = no countdown running)
      selectedTowerType: null, // bottom-bar selection for placement
      selectedTower: null,     // placed tower whose popup is open
      ghost: null,             // {x,y} preview position while a tower type is selected
      paused: false,    // player-toggled freeze
      speed: 1,         // sim speed multiplier (1 or 2)
      wavePicker: null, // when open: the target wave being chosen in the jump picker
      pausedBeforePicker: false, // pause state to restore when the picker closes
      // --- juice ---
      pops: [],         // floating texts {x,y,vy,text,col,life,maxLife}
      particles: [],    // {x,y,vx,vy,life,maxLife,col,r}
      shake: 0,         // screen-shake magnitude (decays each frame)
      flash: 0,         // red damage-flash alpha (decays each frame)
      combo: 0,         // consecutive kills without a leak
      bestCombo: 0,     // high combo this run
      comboTimer: 0,    // ms since last kill (combo fades if idle too long)
      banner: null,     // {text, sub, life, maxLife, col} celebration banner
      winScreen: false, // true once "Map Defended!" is showing (wave 20 cleared)
    };
  }
  // Estimated cash a decent player would hold ARRIVING at the start of wave N
  // (i.e. having cleared N-1 waves). Calibrated to a real-run trajectory + a touch generous.
  function estCashForWave(N) {
    let c = START_CASH;
    for (let w = 1; w < N; w++) c += 70 + 16 * w;
    return c;
  }
  // Close the picker, restoring the pause state it had before opening.
  function closeWavePicker() {
    if (!game) return;
    game.wavePicker = null;
    game.paused = !!game.pausedBeforePicker;
  }
  // Jump straight to wave N: clean (full hearts), granting the estimated cash.
  function jumpToWave(N) {
    if (!game || game.waveActive) return;        // only between waves
    N = Math.max(1, Math.round(N));
    game.wave = N - 1;                            // startWave() increments to N
    game.cash = estCashForWave(N);
    game.countdown = null;                        // player decides when to start
    blip(880, 100);
    closeWavePicker();
  }
  // Arm the pre-wave countdown (on map start and after each wave clears).
  function armCountdown() { if (game) game.countdown = WAVE_COUNTDOWN_MS; }

  // ---- Tower economy + targeting helpers ----

  function towerBuyCost(type) { return TOWERS[type].tiers[0].cost; }
  function towerTierStats(t) { return TOWERS[t.type].tiers[t.tier]; }
  function upgradeCost(t) {
    const tiers = TOWERS[t.type].tiers;
    return t.tier + 1 < tiers.length ? tiers[t.tier + 1].cost : null; // null = maxed
  }
  function sellRefund(t) {
    const tiers = TOWERS[t.type].tiers;
    let spent = 0; for (let i = 0; i <= t.tier; i++) spent += tiers[i].cost;
    return Math.floor(spent * SELL_REFUND);
  }
  // Target the pest furthest along the path (closest to goal) within range.
  // Flyers can only be targeted by anti-air towers.
  function pickTarget(tower) {
    const s = towerTierStats(tower);
    const r2 = s.range * s.range;
    const canHitAir = !!TOWERS[tower.type].antiAir;
    let best = null;
    for (const p of game.pests) {
      if (PESTS[p.type].flying && !canHitAir) continue;   // ground tower can't hit flyers
      const pt = pointAt(game.path, p.dist);
      if (dist2(pt.x, pt.y, tower.x, tower.y) <= r2) {
        if (!best || p.dist > best.dist) best = p;
      }
    }
    return best;
  }

  // ---- Placement + upgrade + sell ----

  let actx = null;
  function blip(freq, ms, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.value = 0.05; o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + ms/1000);
    } catch (e) {}
  }

  // ---- Juice: floating popups, particles, shake, flash, combo, banners ----
  function addPop(x, y, text, col) {
    if (!game) return;
    game.pops.push({ x, y, vy: -0.03, text, col: col || '#fff', life: 900, maxLife: 900 });
    if (game.pops.length > 40) game.pops.shift();   // cap so a big wave can't pile up
  }
  function burst(x, y, col, n, spread) {
    if (!game) return;
    n = n || 8; spread = spread || 0.12;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = spread * (0.4 + Math.random());
      game.particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 0.03,
        life: 600 + Math.random()*300, maxLife: 800, col, r: 1.5 + Math.random()*2 });
    }
    if (game.particles.length > 260) game.particles.splice(0, game.particles.length - 260);
  }
  function addShake(mag) { if (game) game.shake = Math.min(14, Math.max(game.shake, mag)); }
  function addFlash(a)   { if (game) game.flash = Math.min(0.6, Math.max(game.flash, a)); }
  function showBanner(text, sub, col, ms) {
    if (!game) return;
    game.banner = { text, sub: sub || '', col: col || '#ffe14a', life: ms || 2600, maxLife: ms || 2600 };
  }
  function bumpCombo() {
    if (!game) return;
    game.combo += 1; game.comboTimer = 0;
    if (game.combo > game.bestCombo) game.bestCombo = game.combo;
  }
  function resetCombo() { if (game) game.combo = 0; }
  // Advance all juice timers (called from update()).
  function updateJuice(dt) {
    game.shake *= Math.pow(0.86, dt / STEP);  if (game.shake < 0.2) game.shake = 0;
    game.flash *= Math.pow(0.88, dt / STEP);  if (game.flash < 0.01) game.flash = 0;
    for (const p of game.pops) { p.life -= dt; p.y += p.vy * dt; }
    game.pops = game.pops.filter(p => p.life > 0);
    for (const pr of game.particles) {
      pr.life -= dt; pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.vy += 0.0006 * dt; // gravity
    }
    game.particles = game.particles.filter(pr => pr.life > 0);
    if (game.banner) { game.banner.life -= dt; if (game.banner.life <= 0) game.banner = null; }
    if (game.combo > 0) { game.comboTimer += dt; if (game.comboTimer > 3500) resetCombo(); }
  }

  function placeTower(x, y, type) {
    if (!towerUnlocked(type)) return false;   // locked towers can't be placed
    if (game.cash < towerBuyCost(type) || !canPlace(x, y, type)) return false;
    game.cash -= towerBuyCost(type);
    game.towers.push({ type, tier: 0, x, y, cooldown: 0, strikeAnim: 0 });
    blip(660, 60);
    return true;
  }
  function upgradeTower(t) {
    const cost = upgradeCost(t);
    if (cost == null || game.cash < cost) return false;
    game.cash -= cost; t.tier += 1; blip(880, 80); return true;
  }
  function sellTower(t) {
    const i = game.towers.indexOf(t);
    if (i < 0) return;
    game.cash += sellRefund(t);
    game.towers.splice(i, 1);
  }

  // ---- Fixed-timestep loop ----

  const STEP = 1000 / 60; // fixed 60Hz update
  let acc = 0, last = 0;
  function frame(ts) {
    if (!last) last = ts;
    let delta = ts - last; last = ts;
    if (delta > 250) delta = 250; // avoid spiral after tab-away
    // Pause freezes the sim; speed (1x/2x) scales how much sim-time each real frame advances.
    const running = screen === 'playing' && game && !game.paused;
    acc += running ? delta * game.speed : 0;
    while (acc >= STEP) { if (running) update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  // ---- Wave composition + scaling ----

  // Per-map difficulty multiplier (pest HP). Set on each map in MAPS; defaults to 1.
  function mapDiff() { return (game && game.def && game.def.diff) || 1; }

  // HP grows per wave (steeper now) and scales by the map's difficulty; speed ramps a bit.
  // dist0 lets split children spawn partway along the path (at the parent's death spot).
  function scaledPest(type, n, dist0) {
    const base = PESTS[type];
    // Bosses scale GENTLY (linear-ish) — the normal 1.20^n exponential would make a
    // wave-20 boss absurd. Everything else uses the standard per-wave HP ramp.
    const hp = base.boss
      ? Math.round(base.hp * (1 + (n - 10) * 0.08) * mapDiff())   // +8% HP per wave past 10
      : Math.round(base.hp * Math.pow(1.20, n - 1) * mapDiff());
    const speed = base.speed * (1 + Math.min(0.75, (n - 1) * 0.026));
    return { type, hp, maxHp: hp, dist: dist0 || 0, speed, slowUntil: 0 };
  }
  // Composition: counts grow with n (and a little with map difficulty); types are
  // interleaved round-robin so the stream is mixed; boss appended every 5th wave.
  function waveSpec(n) {
    const d = mapDiff();
    const bump = 1 + (d - 1) * 0.5;   // harder maps also send somewhat more pests
    const counts = {
      ant:    Math.round((3 + n) * bump),
      lizard: Math.floor(n * 0.85 * bump),
      beetle: Math.floor(n * 0.6  * bump),
      // Splitters arrive mid-game (wave 4+) and grow slowly — each one becomes 3 bodies.
      aphid:  n >= 4 ? Math.max(1, Math.round((n - 3) * 0.6 * bump)) : 0,
      // Armored snails arrive wave 5+ — want heavy hitters or poison (DoT bypasses armor).
      snail:  n >= 5 ? Math.max(1, Math.round((n - 4) * 0.5 * bump)) : 0,
      // Flyers arrive wave 6+ — need anti-air (Beehive/Zapper/Scarecrow) to hit them.
      moth:   n >= 6 ? Math.max(1, Math.round((n - 5) * 0.55 * bump)) : 0,
    };
    const order = ['ant', 'lizard', 'beetle', 'aphid', 'snail', 'moth'];
    const list = [];
    let remaining = counts.ant + counts.lizard + counts.beetle + counts.aphid + counts.snail + counts.moth;
    while (remaining > 0) {
      for (const t of order) {
        if (counts[t] > 0) { list.push(t); counts[t]--; remaining--; }
      }
    }
    // Caterpillar mini-boss every 5th wave (except the big boss waves, which get Grubzilla).
    if (n % 5 === 0 && !BOSS_WAVES.includes(n)) list.push('cat');
    // Big boss waves (10, 20): Grubzilla lumbers in as the grand finale.
    if (BOSS_WAVES.includes(n)) list.push('grub');
    return list;
  }
  const BOSS_WAVES = [10, 20];
  function isBossWave(n) { return BOSS_WAVES.includes(n); }

  // ---- Wave lifecycle + spawn scheduling ----

  const SPAWN_GAP = 650; // ms between spawns within a wave

  function startWave() {
    if (game.waveActive) return;
    // Early-start bonus: reward starting before the countdown runs out.
    if (game.countdown != null && game.countdown > 0) {
      const secsLeft = Math.ceil(game.countdown / 1000);
      game.cash += secsLeft * EARLY_START_BONUS_PER_SEC;
    }
    game.countdown = null;
    game.wave += 1;
    game.waveActive = true;
    game.elapsed = 0;
    noteWaveReached(game.wave);   // bump account-wide topWave + fire any tower unlocks
    const types = waveSpec(game.wave);
    game.spawnQueue = types.map((type, i) => {
      // The boss lumbers in last, after an extra beat so the swarm clears first.
      const extra = PESTS[type].boss ? 1400 : 0;
      return { type, atMs: i * SPAWN_GAP + extra };
    });
  }
  function leakPest(p) {
    blip(150, 140, 'sine');
    const h = PESTS[p.type].hearts;
    game.hearts -= h;
    // --- juice: a leak hurts — red flash, shake, lost-hearts popup, combo reset ---
    addFlash(0.4); addShake(6);
    const goal = game.path.points[game.path.points.length - 1];
    addPop(goal.x, goal.y - 20, '-' + h + '♥', '#ff5a5a');
    resetCombo();
    if (game.hearts <= 0) { game.hearts = 0; gameOver(); }
  }
  function onWaveCleared() {
    blip(990, 120);
    game.waveActive = false;
    game.cash += WAVE_CLEAR_BONUS;
    const prevBest = meta.best[game.mapId] || 0;
    if (game.wave > prevBest) { meta.best[game.mapId] = game.wave; saveMeta(); }
    // --- milestone celebrations ---
    if (game.wave === UNLOCK_WAVE) {
      const unlocked = unlockNext(game.mapId);   // returns the newly-unlocked map (or null)
      celebrate(unlocked ? 'Next Map Unlocked!' : 'Wave 10 Cleared!',
                unlocked ? unlocked.name + ' is open' : 'Keep going!', '#7ec0ff');
    } else if (game.wave >= UNLOCK_WAVE) {
      unlockNext(game.mapId);                     // (no-op if already unlocked)
    }
    if (game.wave === WIN_WAVE) {
      // "Map Defended!" — big celebration, then the win screen with Home / Continue.
      celebrate('Map Defended!', 'You beat ' + game.def.name + '!', '#ffe14a');
      blip(660, 180); blip(880, 220);
      game.winScreen = true;                      // shown by the renderer; pauses auto-advance
      return;                                     // don't arm the next-wave countdown yet
    }
    armCountdown(); // start the breather before the next wave
  }
  // A celebration: banner + confetti burst from the top-center.
  function celebrate(text, sub, col) {
    showBanner(text, sub, col, 3200);
    const cx = IW / 2, cy = 90;
    const colors = ['#ffe14a', '#ff7a5c', '#7ec0ff', '#5ad15a', '#f2b705'];
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.08 + Math.random() * 0.22;
      game.particles.push({ x: cx + (Math.random()-0.5)*120, y: cy,
        vx: Math.cos(a)*sp, vy: Math.abs(Math.sin(a))*sp*0.5 - 0.04,
        life: 1400 + Math.random()*900, maxLife: 2300,
        col: colors[(Math.random()*colors.length)|0], r: 2 + Math.random()*2.5 });
    }
    addShake(5);
  }
  // Reaching wave n: bump the account-wide topWave and celebrate any tower that just
  // crossed its unlock threshold (permanent, saved).
  function noteWaveReached(n) {
    const prev = meta.topWave || 0;
    if (n <= prev) return;
    // towers whose threshold falls in (prev, n] just unlocked
    const newly = TOWER_ORDER.filter(id => {
      const th = TOWER_UNLOCK[id] || 0;
      return th > prev && th <= n;
    });
    meta.topWave = n; saveMeta();
    if (newly.length) {
      const names = newly.map(id => TOWERS[id].name).join(' + ');
      celebrate(newly.length > 1 ? 'New Towers!' : 'New Tower!', names + ' unlocked', '#5ad15a');
      blip(740, 140); blip(990, 180);
    }
  }
  function unlockNext(mapId) {
    const idx = MAPS.findIndex(m => m.id === mapId);
    const next = MAPS[idx + 1];
    if (next && !meta.unlocked[next.id]) { meta.unlocked[next.id] = true; saveMeta(); return next; }
    return null;
  }
  function gameOver() { screen = 'gameover'; if (typeof renderGameOver === 'function') renderGameOver(); }

  // ---- Firing + projectiles + damage ----

  // Apply damage. Direct hits are reduced by the pest's flat armor (min 1 gets through);
  // poison ticks pass pierce=true to bypass armor (a tick is tiny — armor would zero it).
  function damagePest(p, dmg, pierce) {
    const armor = PESTS[p.type].armor || 0;
    if (armor && !pierce) dmg = Math.max(1, dmg - armor);
    p.hp -= dmg;
    if (p.hp <= 0) { onPestKilled(p); }
  }
  // Poison a pest: duration-based DoT. Re-spraying refreshes the duration and keeps the
  // stronger per-second tick. poisonTick = damage/second; poisonUntil = game.elapsed end.
  function applyPoison(p, tickPerSec, durMs) {
    p.poisonTick = Math.max(p.poisonTick || 0, tickPerSec);
    p.poisonUntil = Math.max(p.poisonUntil || 0, game.elapsed + durMs);
  }
  // Apply all active poison this frame (continuous DoT, armor-piercing).
  function tickPoison(dt) {
    for (const p of game.pests.slice()) {
      if (p.poisonUntil && p.poisonUntil > game.elapsed && p.poisonTick) {
        damagePest(p, p.poisonTick * (dt / 1000), true);   // pierce armor
      }
    }
  }
  function onPestKilled(p) {
    blip(440, 40, 'sawtooth');
    const def = PESTS[p.type];
    game.cash += def.bounty;
    const i = game.pests.indexOf(p);
    if (i >= 0) game.pests.splice(i, 1);
    // --- juice: cash popup, kill burst, combo ---
    const kp = pointAt(game.path, p.dist);
    const ky = kp.y - (def.flying ? 16 : 0);
    addPop(kp.x, ky, '+$' + def.bounty, '#ffe14a');
    burst(kp.x, ky, def.color, def.boss ? 26 : 7, def.boss ? 0.22 : 0.12);
    bumpCombo();
    if (def.boss) {                                   // boss down: big celebration
      blip(220, 300, 'square'); blip(440, 300, 'square');
      addShake(10);
      burst(kp.x, ky, '#ffe14a', 30, 0.25);
      addPop(kp.x, ky - 14, 'BOSS DOWN!', '#ff7a5c');
    }
    // Splitter: spawn children just BEHIND the death spot (so they don't skip ahead,
    // and sit outside any AoE blast that just landed). Children never re-split.
    if (def.splits && def.childType) {
      for (let k = 0; k < def.splits; k++) {
        const back = 10 + k * 8;                 // stagger them slightly along the path
        const d0 = Math.max(0, p.dist - back);
        game.pests.push(scaledPest(def.childType, game.wave, d0));
      }
    }
  }
  function fireTowers(dt) {
    for (const t of game.towers) {
      if (t.strikeAnim > 0) t.strikeAnim -= dt;              // tick the pop-up animation down
      if (t.cooldown > 0) t.cooldown -= dt;   // tick toward ready; never below 0 (no negative debt)
      if (t.cooldown > 0) continue;            // still cooling down
      const def = TOWERS[t.type];
      // Mole Trap: no projectile. When a GROUND pest crosses its buried spot, pop up for
      // big fixed damage, then burrow for the cooldown. Picks the furthest-along pest in trig.
      if (def.trap) {
        const s = towerTierStats(t);
        const trig = def.trig || 16, tr2 = trig * trig;
        let hit = null;
        for (const p of game.pests) {
          if (PESTS[p.type].flying) continue;                // can't trap flyers
          const pt = pointAt(game.path, p.dist);
          if (dist2(pt.x, pt.y, t.x, t.y) <= tr2) {
            if (!hit || p.dist > hit.dist) hit = p;
          }
        }
        if (hit) {
          damagePest(hit, s.dmg);
          blip(120, 120, 'square');
          t.strikeAnim = 320;                                // show the mole for 320ms
          t.cooldown = s.fireMs;                             // burrow + re-arm
        }
        continue;                                            // traps never shoot
      }
      const target = pickTarget(t); if (!target) continue; // ready, but no one to shoot — hold fire, stay at 0
      const s = towerTierStats(t);
      const pt = pointAt(game.path, target.dist);
      if (def.proj === 'bee') {
        // Beehive: launch a swarm of homing bees, fanned out from the hive. Each bee
        // chases its target (re-acquiring if it dies) until it connects or times out.
        const n = s.bees || def.bees || 2;
        for (let b = 0; b < n; b++) {
          const ang = Math.random() * Math.PI * 2, spread = 6 + Math.random() * 6;
          game.projectiles.push({
            x: t.x + Math.cos(ang) * spread, y: t.y + Math.sin(ang) * spread,
            tx: pt.x, ty: pt.y, target, kind: 'bee',
            dmg: s.dmg, aoe: 0, slow: 0, slowMs: 0,
            speed: 170 + Math.random() * 40,     // slight speed variance → organic swarm
            life: 2600,                          // ms before an orphaned bee gives up
          });
        }
      } else {
        game.projectiles.push({
          x: t.x, y: t.y, tx: pt.x, ty: pt.y, target,
          dmg: s.dmg, kind: def.proj, aoe: def.aoe || 0,
          slow: def.slow || 0, slowMs: def.slowMs || 0, speed: 320,
          poisTick: s.poisTick || 0, poisMs: s.poisMs || 0,   // poison payload (sprayer)
        });
      }
      t.cooldown = s.fireMs;                    // start a fresh cooldown from the shot
    }
  }
  // Nearest living pest to a point — bees use this to re-acquire when their target dies.
  function nearestPest(x, y) {
    let best = null, bd = Infinity;
    for (const p of game.pests) {
      const pt = pointAt(game.path, p.dist);
      const d = dist2(pt.x, pt.y, x, y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }
  function advanceProjectiles(dt) {
    const next = [];
    for (const pr of game.projectiles) {
      // Bees: age out, and chase a fresh target if the current one is gone.
      if (pr.kind === 'bee') {
        pr.life -= dt;
        if (pr.life <= 0) continue;                        // orphaned bee gives up
        if (!pr.target || !game.pests.includes(pr.target)) {
          pr.target = nearestPest(pr.x, pr.y);
          if (!pr.target) { next.push(pr); continue; }     // nothing to chase — drift, keep flying
        }
      }
      if (pr.target && game.pests.includes(pr.target)) {
        const pt = pointAt(game.path, pr.target.dist); pr.tx = pt.x; pr.ty = pt.y;
      }
      const dx = pr.tx - pr.x, dy = pr.ty - pr.y;
      const d = Math.hypot(dx, dy);
      const move = pr.speed * (dt / 1000);
      if (d <= move) {
        if (pr.aoe > 0) {
          for (const p of game.pests.slice()) {
            const ppt = pointAt(game.path, p.dist);
            if (dist2(ppt.x, ppt.y, pr.tx, pr.ty) <= pr.aoe * pr.aoe) {
              if (pr.slow) p.slowUntil = game.elapsed + pr.slowMs;
              damagePest(p, pr.dmg);
            }
          }
        } else if (pr.target && game.pests.includes(pr.target)) {
          if (pr.slow) pr.target.slowUntil = game.elapsed + pr.slowMs;
          if (pr.poisTick) applyPoison(pr.target, pr.poisTick, pr.poisMs);
          damagePest(pr.target, pr.dmg);
        }
        // projectile consumed (not pushed to next)
      } else {
        pr.x += dx / d * move; pr.y += dy / d * move; next.push(pr);
      }
    }
    game.projectiles = next;
  }

  function update(dt) {
    // Pre-wave countdown: when no wave is active, tick down and auto-start at 0.
    if (!game.waveActive && game.countdown != null) {
      game.countdown -= dt;
      if (game.countdown <= 0) { game.countdown = null; startWave(); return; }
    }
    game.elapsed += dt;
    updateJuice(dt);
    while (game.spawnQueue.length && game.spawnQueue[0].atMs <= game.elapsed) {
      const s = game.spawnQueue.shift();
      game.pests.push(scaledPest(s.type, game.wave));
      if (PESTS[s.type].boss) {                   // boss enters the field — announce it
        showBanner(PESTS[s.type].name + '!', 'Boss incoming', '#ff7a5c', 2200);
        addShake(8); blip(110, 400, 'sawtooth');
      }
    }
    for (const p of game.pests) {
      const slowed = p.slowUntil > game.elapsed ? 0.5 : 1;
      p.dist += p.speed * slowed * (dt / 1000);
    }
    const leaked = game.pests.filter(p => p.dist >= game.path.total);
    leaked.forEach(leakPest);
    if (screen !== 'playing') return;   // gameOver() fired — stop processing this frame
    game.pests = game.pests.filter(p => p.dist < game.path.total);
    fireTowers(dt);
    advanceProjectiles(dt);
    tickPoison(dt);   // damage-over-time resolves after direct hits
    // Wave clears the instant the last pest is gone — any still-airborne projectiles
    // are orphaned (their target is dead) and can't affect anything, so don't wait on them.
    if (game.waveActive && !game.spawnQueue.length && !game.pests.length) onWaveCleared();
  }

  function hudHitRects() {
    const barY = IH - 40, gap = 8, x0 = 8;
    // Fit all tower buttons across the full width (shrinks as towers are added).
    const bw = Math.floor((IW - x0*2 - gap*(TOWER_ORDER.length - 1)) / TOWER_ORDER.length);
    const towers = TOWER_ORDER.map((id, i) => ({ id, x: x0 + i*(bw+gap), y: barY, w: bw, h: 34 }));
    const startWave = { x: IW - 138, y: 26, w: 128, h: 26 };
    // Menu sits in the PLAYFIELD just below the top strip (top-left). The top ~22px strip
    // is a dead tap zone in the standalone app (system UI swallows touches there), so a
    // button up there is unreachable — keep it below y26 where taps actually register.
    const menu = { x: 8, y: 26, w: 76, h: 26 };
    const menuHit = { x: 4, y: 24, w: 86, h: 32 };   // small forgiving margin
    // Pause + speed sit to the right of Menu, same tappable row.
    const pause = { x: 92,  y: 26, w: 40, h: 26 };
    const speed = { x: 136, y: 26, w: 40, h: 26 };
    // "Jump" wave button — in the live HUD row (easy to tap), to the right of speed.
    const waveBtn = { x: 184, y: 26, w: 92, h: 26 };
    return { towers, startWave, menu, menuHit, pause, speed, waveBtn };
  }

  // Centered wave-jump picker: − [N] + with Jump and Cancel buttons stacked below.
  function wavePickerRects() {
    const w = 230, h = 130, x = (IW - w) / 2, y = 60;
    return {
      box:    { x, y, w, h },
      minus:  { x: x + 16,     y: y + 28, w: 44, h: 36 },
      plus:   { x: x + w - 60, y: y + 28, w: 44, h: 36 },
      jump:   { x: x + 28,     y: y + 72, w: w - 56, h: 24 },
      cancel: { x: x + 28,     y: y + 100, w: w - 56, h: 22 },
    };
  }

  // Max tier-0 stat values across SHOOTING towers, for normalizing the shop bars (0..1).
  // Traps (mole) are excluded — their huge fixed dmg / tiny range would wreck the scale.
  const STAT_TOWERS = TOWER_ORDER.filter(k => !TOWERS[k].trap);
  const STAT_MAX = {
    dmg:   Math.max(...STAT_TOWERS.map(k => TOWERS[k].tiers[0].dmg)),
    range: Math.max(...STAT_TOWERS.map(k => TOWERS[k].tiers[0].range)),
    rate:  Math.max(...STAT_TOWERS.map(k => 1000 / TOWERS[k].tiers[0].fireMs)),
  };
  // Shop preview panel: shows the tapped (but not-yet-placed) tower's stats as bars.
  function drawShopStats() {
    const id = game.selectedTowerType;
    if (!id) return;
    const def = TOWERS[id], t0 = def.tiers[0];
    const rate = 1000 / t0.fireMs;
    // Traps read differently: show raw hit damage + reload time, not the shooter bars.
    const rows = def.trap ? [
      { label: 'HIT',    frac: Math.min(1, t0.dmg / 600),            col: '#ff7a5c' },
      { label: 'RELOAD', frac: Math.max(0.1, 1 - t0.fireMs / 9000),  col: '#ffe14a' },
    ] : [
      { label: 'PWR',   frac: t0.dmg / STAT_MAX.dmg,     col: '#ff7a5c' },
      { label: 'RANGE', frac: t0.range / STAT_MAX.range, col: '#7ec0ff' },
      { label: 'SPEED', frac: rate / STAT_MAX.rate,      col: '#ffe14a' },
    ];
    const w = 168, h = 70, pad = 8;
    const x = 8, y = (IH - 40) - h - 6; // sit just above the tower bar, left-aligned
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.strokeRect(x+1, y+1, w-2, h-2);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textBaseline = 'middle';
    ctx.fillText(def.name, x + pad, y + 11);
    const barX = x + pad + 42, barW = w - pad*2 - 42, rowH = 15;
    rows.forEach((r, i) => {
      const ry = y + 26 + i*rowH;
      ctx.fillStyle = '#bbb'; ctx.font = '9px monospace';
      ctx.fillText(r.label, x + pad, ry + 4);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(barX, ry, barW, 7);
      ctx.fillStyle = r.col;
      ctx.fillRect(barX, ry, barW * Math.max(0.06, Math.min(1, r.frac)), 7);
    });
  }

  // Crisp canvas-drawn icons (iOS renders ▶/⏸ unicode as full-color emoji — avoid those).
  // All draw in the current ctx.fillStyle; (cx,cy) is the icon center, s the box size.
  function drawPlayIcon(cx, cy, s) {
    const h = s, w = s * 0.85;
    ctx.beginPath();
    ctx.moveTo(cx - w/2, cy - h/2);
    ctx.lineTo(cx + w/2, cy);
    ctx.lineTo(cx - w/2, cy + h/2);
    ctx.closePath();
    ctx.fill();
  }
  function drawPauseIcon(cx, cy, s) {
    const bw = s * 0.28, gap = s * 0.22, h = s;
    ctx.fillRect(cx - gap/2 - bw, cy - h/2, bw, h);
    ctx.fillRect(cx + gap/2,      cy - h/2, bw, h);
  }
  // Capability tag badge: a colored disc (~R=6) with a small white glyph. Each kind has
  // its own color + symbol so the kid learns them: air=wing/blue, aoe=burst/orange,
  // poison=skull/green, slow=snowflake/cyan.
  const TAG_COLORS = { air:'#4aa3ff', aoe:'#ff8a3c', poison:'#7ec850', slow:'#4ad6c0' };
  function drawTag(kind, cx, cy) {
    const R = 6;
    // disc + dark rim for contrast on any background
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.arc(cx, cy, R + 1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = TAG_COLORS[kind] || '#ccc';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
    ctx.lineWidth = 1.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (kind === 'air') {
      // a little wing/chevron suggesting flight
      ctx.beginPath();
      ctx.moveTo(cx - 3, cy + 1.5); ctx.quadraticCurveTo(cx - 1, cy - 2.5, cx + 3, cy - 2);
      ctx.quadraticCurveTo(cx, cy, cx + 2, cy + 2); ctx.stroke();
    } else if (kind === 'aoe') {
      // burst: a center dot + short rays
      ctx.fillRect(cx - 1, cy - 1, 2, 2);
      for (let a = 0; a < 8; a++) {
        const an = a * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(an)*2.2, cy + Math.sin(an)*2.2);
        ctx.lineTo(cx + Math.cos(an)*4,   cy + Math.sin(an)*4);
        ctx.stroke();
      }
    } else if (kind === 'poison') {
      // skull: round head + two eye sockets + jaw line
      ctx.beginPath(); ctx.arc(cx, cy - 0.5, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = TAG_COLORS.poison;
      ctx.beginPath(); ctx.arc(cx - 1.2, cy - 1, 0.9, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 1.2, cy - 1, 0.9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 1.6, cy + 2, 3.2, 1.6);            // jaw
      ctx.fillStyle = TAG_COLORS.poison;
      ctx.fillRect(cx - 1, cy + 2.2, 0.7, 1.2);
      ctx.fillRect(cx + 0.3, cy + 2.2, 0.7, 1.2);
    } else if (kind === 'slow') {
      // snowflake: 3 crossing lines
      for (let a = 0; a < 3; a++) {
        const an = a * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(an)*3.5, cy - Math.sin(an)*3.5);
        ctx.lineTo(cx + Math.cos(an)*3.5, cy + Math.sin(an)*3.5);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Tiny canvas-drawn padlock (locked-tower marker). cx,cy ≈ center; ~7px tall.
  function drawLock(cx, cy) {
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 1.3;        // shackle (amber, matches text)
    ctx.beginPath(); ctx.arc(cx, cy - 2, 1.8, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#ffd24a';                               // body
    ctx.fillRect(cx - 2.6, cy - 1, 5.2, 4.2);
    ctx.fillStyle = '#4a3a10';                               // keyhole
    ctx.fillRect(cx - 0.4, cy + 0.2, 0.8, 1.8);
  }
  // Canvas-drawn beehive (no sprite): a stacked-dome skep with stripes + entrance hole.
  function drawBeehive(cx, cy, scale) {
    scale = scale || 1;
    const w = 20 * scale, h = 18 * scale;
    ctx.save();
    ctx.translate(cx, cy);
    // dome bands (bottom-up), light gold → darker gold
    const bands = 4;
    for (let i = 0; i < bands; i++) {
      const by = h/2 - (i+1) * (h/bands);
      const bw = w * (1 - i*0.16);
      ctx.fillStyle = i % 2 ? '#e0a200' : '#f2b705';
      ctx.beginPath();
      ctx.ellipse(0, by + (h/bands)/2, bw/2, (h/bands)/2 + 1, 0, 0, Math.PI*2);
      ctx.fill();
    }
    // entrance hole
    ctx.fillStyle = '#5a3d00';
    ctx.beginPath(); ctx.ellipse(0, h/2 - h/bands*0.5, 2.2*scale, 2.6*scale, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // Canvas-drawn mole trap: a dirt mound with a dark burrow hole; when 'pop' (0..1) is
  // high, a little mole head rises out of the hole (the strike animation).
  function drawMole(cx, cy, scale, pop) {
    scale = scale || 1; pop = pop || 0;
    ctx.save();
    ctx.translate(cx, cy);
    // dirt mound
    ctx.fillStyle = '#8a5a2b';
    ctx.beginPath(); ctx.ellipse(0, 4*scale, 11*scale, 6*scale, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6e461f';
    ctx.beginPath(); ctx.ellipse(0, 5*scale, 11*scale, 5*scale, 0, 0, Math.PI, true); ctx.fill();
    // burrow hole
    ctx.fillStyle = '#2a1a0a';
    ctx.beginPath(); ctx.ellipse(0, 1*scale, 5.5*scale, 3.5*scale, 0, 0, Math.PI*2); ctx.fill();
    // mole head popping up (only during strike)
    if (pop > 0.02) {
      const rise = 7 * scale * pop;
      ctx.fillStyle = '#4a3322';
      ctx.beginPath(); ctx.arc(0, 1*scale - rise, 4.2*scale, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffd9b0';                        // snout
      ctx.beginPath(); ctx.arc(0, 2*scale - rise, 1.6*scale, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1008';                        // eyes
      ctx.beginPath(); ctx.arc(-1.6*scale, 0.4*scale - rise, 0.7*scale, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( 1.6*scale, 0.4*scale - rise, 0.7*scale, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // Canvas-drawn Thorn Flinger: a bramble bush/pod with spiky stems radiating out,
  // tipped with poison thorns (purple-green). Reads as "shoots toxic thorns".
  function drawSprayer(cx, cy, scale) {
    scale = scale || 1;
    ctx.save(); ctx.translate(cx, cy);
    // spiky thorn stems radiating up/out
    ctx.strokeStyle = '#4a6b24'; ctx.lineWidth = 1.6 * scale; ctx.lineCap = 'round';
    const stems = [ [-7,-7], [0,-10], [7,-7], [-9,-1], [9,-1] ];
    for (const [ex, ey] of stems) {
      ctx.beginPath(); ctx.moveTo(0, 1*scale); ctx.lineTo(ex*scale*0.8, ey*scale*0.8); ctx.stroke();
      // poison thorn tip (a small pointed diamond)
      const tx = ex*scale*0.8, ty = ey*scale*0.8;
      ctx.fillStyle = '#9d6fc0';                            // poison purple
      ctx.beginPath();
      ctx.moveTo(tx, ty - 2.4*scale); ctx.lineTo(tx + 1.6*scale, ty);
      ctx.lineTo(tx, ty + 2.4*scale); ctx.lineTo(tx - 1.6*scale, ty); ctx.closePath(); ctx.fill();
    }
    // bramble pod / base bush
    ctx.fillStyle = '#5f8a2e';
    ctx.beginPath(); ctx.arc(0, 2*scale, 6*scale, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7fae3c';                               // lit top
    ctx.beginPath(); ctx.arc(-1.5*scale, 0.5*scale, 3.2*scale, 0, Math.PI*2); ctx.fill();
    // a couple of toxic berries
    ctx.fillStyle = '#b388e0';
    ctx.beginPath(); ctx.arc(2.5*scale, 3*scale, 1.4*scale, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-2.5*scale, 4*scale, 1.1*scale, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    const hud = hudHitRects();
    // top strip
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, IW, 22);
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textBaseline = 'middle';
    ctx.fillText('♥ ' + game.hearts, 8, 11);
    ctx.fillText('$ ' + game.cash, 90, 11);
    ctx.fillText('Wave ' + game.wave, 180, 11);
    if (game.def) ctx.fillText(game.def.name, 290, 11);
    // version tag, right-aligned in the header
    ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(VERSION, IW - 8, 11);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff';

    // Menu button (return to map select) — in the playfield just below the top strip
    const mb = hud.menu;
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(mb.x, mb.y, mb.w, mb.h);
    ctx.fillStyle = '#fff'; ctx.font = '12px monospace';
    ctx.fillText('☰ Menu', mb.x + 9, mb.y + mb.h/2);

    // Pause / resume toggle
    const pb = hud.pause;
    ctx.fillStyle = game.paused ? '#b5532e' : '#2e7d32';
    ctx.fillRect(pb.x, pb.y, pb.w, pb.h);
    ctx.fillStyle = '#fff';
    if (game.paused) drawPlayIcon(pb.x + pb.w/2, pb.y + pb.h/2, 11);
    else             drawPauseIcon(pb.x + pb.w/2, pb.y + pb.h/2, 11);

    // Speed toggle (1x / 2x)
    const sb = hud.speed;
    ctx.fillStyle = game.speed === 2 ? '#c49a1f' : '#2e7d32';
    ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
    ctx.fillStyle = '#fff';
    ctx.fillText(game.speed + 'x', sb.x + sb.w/2 - 8, sb.y + sb.h/2);

    // Wave-jump button (disabled-looking while a wave is active)
    const wb = hud.waveBtn;
    const canJump = !game.waveActive;
    ctx.fillStyle = canJump ? '#3a5f8a' : 'rgba(0,0,0,0.3)';
    ctx.fillRect(wb.x, wb.y, wb.w, wb.h);
    ctx.fillStyle = canJump ? '#fff' : '#888'; ctx.font = '11px monospace';
    ctx.fillText('Jump Wave', wb.x + 8, wb.y + wb.h/2);

    // small "PAUSED" label to the right of the wave button (game stays interactive)
    if (game.paused) {
      ctx.fillStyle = '#fff'; ctx.font = '12px monospace';
      drawPauseIcon(wb.x + wb.w + 15, wb.y + wb.h/2, 10);
      ctx.fillText('PAUSED', wb.x + wb.w + 24, wb.y + wb.h/2);
    }

    // bottom tower bar
    hud.towers.forEach(tb => {
      const id = tb.id;
      const locked = !towerUnlocked(id);
      const cost = towerBuyCost(id);
      const affordable = !locked && game.cash >= cost;
      const selected = game.selectedTowerType === id;
      ctx.fillStyle = selected ? '#2e7d32' : (affordable ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.25)');
      ctx.fillRect(tb.x, tb.y, tb.w, tb.h);
      // tower icon (sprite) over a faint color backing; dim when unaffordable OR locked
      const dim = locked ? 0.25 : (affordable ? 1 : 0.4);
      ctx.fillStyle = affordable ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.15)';
      ctx.fillRect(tb.x + 3, tb.y + 4, 26, 26);
      const im = IMG[TOWERS[id].img];
      if (im && im.width) {
        ctx.globalAlpha = dim;
        ctx.drawImage(im, tb.x + 4, tb.y + 5);   // 24x24 sprite
        ctx.globalAlpha = 1;
      } else if (id === 'beehive') {              // canvas-drawn beehive icon
        ctx.globalAlpha = dim; drawBeehive(tb.x + 16, tb.y + 17, 0.9); ctx.globalAlpha = 1;
      } else if (id === 'mole') {                 // canvas-drawn mole-trap icon
        ctx.globalAlpha = dim; drawMole(tb.x + 16, tb.y + 15, 0.95, 0.7); ctx.globalAlpha = 1;
      } else if (id === 'sprayer') {              // canvas-drawn sprayer icon
        ctx.globalAlpha = dim; drawSprayer(tb.x + 16, tb.y + 15, 0.9); ctx.globalAlpha = 1;
      } else {                                    // fallback color box if sprite missing
        ctx.fillStyle = affordable ? TOWERS[id].color : '#777';
        ctx.fillRect(tb.x + 4, tb.y + 7, 20, 20);
      }
      ctx.font = '10px monospace';
      if (locked) {
        // locked: name dimmed; a padlock + bright "Wave N" requirement under it (kept
        // left-aligned under the icon so it never crowds the right edge).
        ctx.fillStyle = '#9aa7b0';
        ctx.fillText(TOWERS[id].short || TOWERS[id].name, tb.x + 32, tb.y + 12);
        drawLock(tb.x + 35, tb.y + 25);
        ctx.fillStyle = '#ffd24a';                 // bright amber reads as "requirement"
        ctx.font = 'bold 9px monospace';
        ctx.fillText('Wv ' + TOWER_UNLOCK[id], tb.x + 42, tb.y + 25);
      } else {
        ctx.fillStyle = affordable ? '#fff' : '#999';
        ctx.fillText(TOWERS[id].short || TOWERS[id].name, tb.x + 32, tb.y + 12);
        ctx.fillText('$' + cost, tb.x + 32, tb.y + 25);
      }
      ctx.font = '12px monospace';
      // capability tag badges, floating just ABOVE the slot (right-aligned), always shown
      // (even when locked) so they double as "here's what this one does".
      const tags = towerTags(id);
      if (tags.length) {
        // sit the badges straddling the slot's top edge (~30% of their height overlaps
        // the box) so they use less of the play area above the bar.
        const gap = 15, ty = tb.y - 4;
        let tx = tb.x + tb.w - 9 - (tags.length - 1) * gap;
        ctx.globalAlpha = locked ? 0.7 : 1;
        for (const kind of tags) { drawTag(kind, tx, ty); tx += gap; }
        ctx.globalAlpha = 1;
      }
    });

    // Start Wave button when idle, with the auto-start countdown
    if (!game.waveActive) {
      const b = hud.startWave;
      const secs = game.countdown != null ? Math.ceil(game.countdown / 1000) : null;
      // urgent (red-ish) in the last 3s so it draws the eye
      ctx.fillStyle = (secs != null && secs <= 3) ? '#b5532e' : '#2e7d32';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      // countdown progress fill (drains left→right as time runs out)
      if (secs != null) {
        const frac = Math.max(0, Math.min(1, game.countdown / WAVE_COUNTDOWN_MS));
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(b.x, b.y, b.w * frac, b.h);
      }
      ctx.fillStyle = '#fff';
      drawPlayIcon(b.x + 13, b.y + b.h/2, 9);
      const label = secs != null ? ('Start  ' + secs + 's') : 'Start Wave';
      ctx.fillText(label, b.x + 22, b.y + b.h/2);
    }
  }

  // ---- Tap input ----

  function canvasPoint(evt) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return { x: -1, y: -1 };  // not laid out — treat as a miss
    const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
    return { x: cx / rect.width * IW, y: cy / rect.height * IH };
  }
  function inRect(p, r) { return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }

  function popupHitRects(tw) {
    const w = 140, h = 96;
    // Prefer placing to the right of the tower; flip left if it'd run off the edge.
    let x = tw.x + 16;
    if (x + w > IW - 4) x = tw.x - 16 - w;
    x = Math.max(4, Math.min(IW - w - 4, x));
    const barTop = IH - 40;                          // tower bar top (matches hudHitRects)
    const y = Math.min(barTop - h - 4, Math.max(24, tw.y - h/2));
    const bw = (w - 18) / 2;                          // two side-by-side buttons
    return {
      box:    { x, y, w, h },
      upgrade:{ x: x+6,      y: y+h-26, w: bw, h: 20 },
      sell:   { x: x+12+bw,  y: y+h-26, w: bw, h: 20 },
    };
  }
  function drawPopup() {
    if (!game.selectedTower) return;
    const t = game.selectedTower, r = popupHitRects(t), b = r.box;
    const def = TOWERS[t.type], s = towerTierStats(t);
    const rate = 1000 / s.fireMs;

    // panel
    ctx.fillStyle = 'rgba(0,0,0,0.82)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.strokeRect(b.x+1, b.y+1, b.w-2, b.h-2);

    // title: name + current tier
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textBaseline = 'middle';
    ctx.fillText(def.name, b.x + 8, b.y + 11);
    ctx.fillStyle = '#ffe14a'; ctx.font = '9px monospace';
    ctx.fillText('Lv ' + (t.tier + 1), b.x + b.w - 30, b.y + 11);

    // current-tier stat bars — traps show HIT/RELOAD, shooters show PWR/RANGE/SPEED
    const rows = def.trap ? [
      { label:'HIT',    frac: Math.min(1, s.dmg / 600),           col:'#ff7a5c' },
      { label:'RELOAD', frac: Math.max(0.1, 1 - s.fireMs / 9000), col:'#ffe14a' },
    ] : [
      { label:'PWR',   frac: s.dmg / STAT_MAX.dmg,     col:'#ff7a5c' },
      { label:'RANGE', frac: s.range / STAT_MAX.range, col:'#7ec0ff' },
      { label:'SPEED', frac: rate / STAT_MAX.rate,     col:'#ffe14a' },
    ];
    const barX = b.x + 48, barW = b.w - 8 - 48, rowH = 13;
    ctx.font = '9px monospace';
    rows.forEach((row, i) => {
      const ry = b.y + 24 + i*rowH;
      ctx.fillStyle = '#bbb'; ctx.fillText(row.label, b.x + 8, ry + 4);
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(barX, ry, barW, 6);
      ctx.fillStyle = row.col; ctx.fillRect(barX, ry, barW * Math.max(0.06, Math.min(1, row.frac)), 6);
    });

    // ---- Upgrade button (green, ▲ + cost) ----
    const up = upgradeCost(t);
    const maxed = up == null;
    const canAfford = !maxed && game.cash >= up;     // live-updates each frame as cash changes
    ctx.fillStyle = maxed ? '#555' : (canAfford ? '#2e7d32' : '#26432a');
    ctx.fillRect(r.upgrade.x, r.upgrade.y, r.upgrade.w, r.upgrade.h);
    ctx.fillStyle = maxed ? '#aaa' : (canAfford ? '#fff' : '#6f8a72');
    ctx.font = '10px monospace';
    ctx.fillText(maxed ? 'MAX' : ('▲ $' + up), r.upgrade.x + 6, r.upgrade.y + 11);

    // ---- Sell button (red, $ + refund) ----
    ctx.fillStyle = '#8a3b2b'; ctx.fillRect(r.sell.x, r.sell.y, r.sell.w, r.sell.h);
    ctx.fillStyle = '#fff';
    ctx.fillText('$ ' + sellRefund(t), r.sell.x + 6, r.sell.y + 11);
  }

  let dragging = false;  // true while press-and-dragging a ghost into place

  // Pointer DOWN: handle UI, or begin placing/selecting on the field.
  function onDown(evt) {
    evt.preventDefault();
    if (screen !== 'playing') return;   // map select & game over use DOM overlays
    const p = canvasPoint(evt);
    const hud = hudHitRects();
    dragging = false;

    // (0a) win screen is modal: only Home / Continue act.
    if (game.winScreen) {
      const r = winScreenRects();
      if (inRect(p, r.home)) { game.winScreen = false; showMapSelect(); return; }
      if (inRect(p, r.cont)) { game.winScreen = false; armCountdown(); return; }  // keep playing (endless)
      return;  // swallow other taps
    }

    // (0) wave-jump picker is modal: only its own buttons act; taps elsewhere are ignored
    //     (no tap-outside-to-cancel, to avoid accidental dismissal).
    if (game.wavePicker != null) {
      const pk = wavePickerRects();
      if (inRect(p, pk.minus))  { game.wavePicker = Math.max(1, game.wavePicker - 1); return; }
      if (inRect(p, pk.plus))   { game.wavePicker = game.wavePicker + 1; return; }
      if (inRect(p, pk.jump))   { jumpToWave(game.wavePicker); return; }
      if (inRect(p, pk.cancel)) { closeWavePicker(); return; }
      return;  // swallow taps outside the modal
    }

    // (a) HUD buttons
    if (inRect(p, hud.menuHit)) { showMapSelect(); return; }
    if (inRect(p, hud.pause))   { game.paused = !game.paused; return; }
    if (inRect(p, hud.speed))   { game.speed = game.speed === 2 ? 1 : 2; return; }
    // Jump-Wave button → open the jump picker (pauses while choosing)
    if (inRect(p, hud.waveBtn)) {
      if (!game.waveActive) {
        game.wavePicker = Math.max(1, game.wave + 1);
        game.pausedBeforePicker = game.paused;  // remember, so we don't un-pause a manual pause
        game.paused = true;
      }
      return;
    }
    if (!game.waveActive && inRect(p, hud.startWave)) { startWave(); return; }
    for (const tb of hud.towers) {
      if (inRect(p, tb)) {
        if (!towerUnlocked(tb.id)) {               // locked — soft reject, hint at the wave
          blip(200, 90, 'sine');
          showBanner('Locked', 'Reach Wave ' + TOWER_UNLOCK[tb.id] + ' to unlock', '#aaa', 1600);
          return;
        }
        game.selectedTowerType = (game.selectedTowerType === tb.id) ? null : tb.id;
        game.selectedTower = null; game.ghost = null;
        return;
      }
    }
    // (b) open popup's Upgrade/Sell buttons
    if (game.selectedTower) {
      const pop = popupHitRects(game.selectedTower);
      if (inRect(p, pop.upgrade)) { upgradeTower(game.selectedTower); return; }
      if (inRect(p, pop.sell))    { sellTower(game.selectedTower); game.selectedTower = null; return; }
    }
    // (c) a tower type is armed → begin a drag: ghost follows the pointer, placed on release
    if (game.selectedTowerType) {
      dragging = true;
      game.ghost = { x: p.x, y: p.y };
      return;
    }
    // (d) tapped an existing tower → open its popup
    let hitTower = null, bestD = TOWER_R*TOWER_R;
    for (const t of game.towers) {
      const d = dist2(p.x, p.y, t.x, t.y);
      if (d < bestD) { bestD = d; hitTower = t; }
    }
    if (hitTower) { game.selectedTower = hitTower; return; }
    // (e) empty space clears selection/popup
    game.selectedTower = null; game.ghost = null;
  }

  // Pointer MOVE: while dragging, the ghost follows (render shows live validity).
  function onMove(evt) {
    if (!dragging || !game || !game.selectedTowerType) return;
    evt.preventDefault();
    const p = canvasPoint(evt);
    game.ghost = { x: p.x, y: p.y };
  }

  // Pointer UP: drop the tower at the ghost position (place if valid+affordable).
  function onUp(evt) {
    if (!dragging) return;
    evt.preventDefault();
    dragging = false;
    if (!game || !game.selectedTowerType || !game.ghost) return;
    const g = game.ghost;
    if (placeTower(g.x, g.y, game.selectedTowerType)) {
      game.selectedTowerType = null;  // placed — disarm
    } else {
      blip(180, 90, 'sine');   // invalid spot / can't afford — soft reject, stay armed
    }
    game.ghost = null;  // clear the preview on release either way
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);   // catch release even outside the canvas
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove',  onMove, { passive: false });
  canvas.addEventListener('touchend',   onUp,   { passive: false });

  function render() {
    if (screen !== 'playing' || !game) {
      // Not in play: paint the textured grass so the map-select / game-over
      // overlays (transparent DOM) sit on the same lawn as the game, not flat green.
      ctx.fillStyle = '#6ab04c'; ctx.fillRect(0, 0, IW, IH);
      ctx.fillStyle = GRASS_TILE; ctx.fillRect(0, 0, IW, IH);
      return;
    }
    // Screen shake: offset the whole gameplay layer by a decaying random jitter.
    ctx.save();
    if (game.shake > 0.2) {
      const sx = (Math.random() - 0.5) * game.shake, sy = (Math.random() - 0.5) * game.shake;
      ctx.translate(sx, sy);
    }
    drawTerrain(game.path);
    drawDecor(game.decor);   // trees + bushes sit on the grass, under towers/pests
    for (const p of game.pests) {
      const def = PESTS[p.type];
      const pt = pointAt(game.path, p.dist);
      const im = IMG[def.img];
      let drawH = def.sprH || def.size;
      // Boss (Grubzilla): big canvas-drawn brute with a chunky look + prominent bar.
      if (def.boss) {
        const r = def.size / 2, wob = Math.sin(p.dist / 6) * 2;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.ellipse(pt.x, pt.y + r*0.7, r*1.05, r*0.45, 0, 0, Math.PI*2); ctx.fill();
        // segmented body
        for (let seg = 2; seg >= 0; seg--) {
          ctx.fillStyle = seg % 2 ? '#5f3b80' : def.color;
          ctx.beginPath(); ctx.arc(pt.x - seg*4 + wob*0.3, pt.y, r - seg*1.5, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = '#3a2450';                         // spiky back ridges
        for (let k = -1; k <= 1; k++) { ctx.beginPath();
          ctx.moveTo(pt.x + k*8, pt.y - r*0.7); ctx.lineTo(pt.x + k*8 - 3, pt.y - r*1.15);
          ctx.lineTo(pt.x + k*8 + 3, pt.y - r*1.15); ctx.closePath(); ctx.fill(); }
        ctx.fillStyle = '#ffe14a';                         // angry eyes
        ctx.beginPath(); ctx.arc(pt.x + r*0.5 + wob, pt.y - r*0.2, 2.6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(pt.x + r*0.5 + wob, pt.y + r*0.3, 2.6, 0, Math.PI*2); ctx.fill();
        // big HP bar always visible above the boss
        const frac = Math.max(0, p.hp / p.maxHp), bw = 46;
        const bx = Math.round(pt.x - bw/2), by = Math.round(pt.y - r - 12);
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(bx-1, by-1, bw+2, 7);
        ctx.fillStyle = frac > 0.5 ? '#5ad15a' : frac > 0.25 ? '#ffe14a' : '#e8503a';
        ctx.fillRect(bx, by, Math.round(bw*frac), 5);
        continue;
      }
      // Flyers (moth): hover ABOVE the path with a ground shadow + fluttering wings.
      if (def.flying) {
        const lift = 14 + Math.sin(p.dist / 9) * 2;        // hover height + gentle bob
        const fx = pt.x, fy = pt.y - lift;
        ctx.fillStyle = 'rgba(0,0,0,0.18)';                // shadow on the path below
        ctx.beginPath(); ctx.ellipse(pt.x, pt.y + 2, 6, 2.4, 0, 0, Math.PI*2); ctx.fill();
        const r = def.size / 2;
        const flap = (Math.floor(game.elapsed / 70) % 2) ? 1 : 0.6;  // wing-beat
        ctx.fillStyle = 'rgba(190,175,140,0.9)';           // wings
        ctx.beginPath(); ctx.ellipse(fx - r*0.7, fy, r*0.8, r*flap, -0.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(fx + r*0.7, fy, r*0.8, r*flap,  0.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = def.color;                         // body
        ctx.beginPath(); ctx.ellipse(fx, fy, r*0.4, r*0.75, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(60,45,20,0.8)';              // two tiny antennae dots
        ctx.beginPath(); ctx.arc(fx - 1.5, fy - r*0.7, 0.9, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(fx + 1.5, fy - r*0.7, 0.9, 0, Math.PI*2); ctx.fill();
        if (p.hp < p.maxHp) {                              // health bar above the flyer
          const frac = Math.max(0, p.hp / p.maxHp), bw = 16;
          const bx = Math.round(fx - bw/2), by = Math.round(fy - r - 8);
          ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx-1, by-1, bw+2, 5);
          ctx.fillStyle = frac > 0.5 ? '#5ad15a' : frac > 0.25 ? '#ffe14a' : '#e8503a';
          ctx.fillRect(bx, by, Math.round(bw*frac), 3);
        }
        continue;
      }
      if (im && im.width) {
        const fw = im.width / 2;                       // 2-frame walk strip
        const frame = Math.floor(p.dist / 8) % 2;      // wiggle by distance traveled
        drawH = im.height;
        ctx.drawImage(im, frame*fw, 0, fw, im.height, Math.round(pt.x - fw/2), Math.round(pt.y - im.height/2), fw, im.height);
      } else if (def.armor) {
        // Snail: a foot/body with a spiral shell on top — reads as the armored one.
        const r = def.size / 2, wob = Math.sin(p.dist / 6) * 0.8;
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath(); ctx.ellipse(pt.x, pt.y + r*0.6, r*1.05, r*0.4, 0, 0, Math.PI*2); ctx.fill();
        // soft body/foot
        ctx.fillStyle = '#d8b48a';
        ctx.beginPath(); ctx.ellipse(pt.x + wob, pt.y + r*0.3, r*1.0, r*0.5, 0, 0, Math.PI*2); ctx.fill();
        // head + eye stalks (leading, in travel direction ≈ to the right)
        ctx.beginPath(); ctx.ellipse(pt.x + r*0.9 + wob, pt.y + r*0.1, r*0.4, r*0.35, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#d8b48a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(pt.x + r*1.0, pt.y); ctx.lineTo(pt.x + r*1.2, pt.y - r*0.7); ctx.stroke();
        ctx.fillStyle = '#3a2a1a';
        ctx.beginPath(); ctx.arc(pt.x + r*1.2, pt.y - r*0.7, 1, 0, Math.PI*2); ctx.fill();
        // the armored shell (spiral)
        ctx.fillStyle = def.color;
        ctx.beginPath(); ctx.arc(pt.x - r*0.2 + wob, pt.y - r*0.15, r*0.85, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#7a4f2a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(pt.x - r*0.2 + wob, pt.y - r*0.15, r*0.55, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(pt.x - r*0.2 + wob, pt.y - r*0.15, r*0.28, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath(); ctx.arc(pt.x - r*0.45 + wob, pt.y - r*0.4, r*0.2, 0, Math.PI*2); ctx.fill();
      } else {
        // No sprite (aphids): draw a little rounded body with a darker rim + top highlight,
        // plus two tiny antennae so it reads as a bug, not a plain dot.
        const r = def.size / 2;
        const wob = Math.sin(p.dist / 5) * 1.2;          // subtle waddle
        ctx.fillStyle = 'rgba(0,0,0,0.18)';              // ground shadow
        ctx.beginPath(); ctx.ellipse(pt.x, pt.y + r*0.7, r*0.95, r*0.4, 0, 0, Math.PI*2); ctx.fill();
